<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <meta name="description" content="Privé live kijkpagina voor een Dodentocht 2026-wandelaar.">
  <title>Dodentocht 2026 · Live</title>
  <link rel="stylesheet" href="style.css?v=4.5.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body class="live-viewer-page">
  <main class="viewer-shell">
    <div class="brand-lockup">
      <span class="brand-100">100 KM</span>
      <div class="brand-copy">
        <span class="app-kicker">DODENTOCHT 2026</span>
        <span class="brand-subline">Live volgen</span>
      </div>
    </div>

    <section class="viewer-hero">
      <div class="viewer-live-badge" id="liveBadge" role="status" aria-live="polite">● Verbinden…</div>
      <div style="margin-top:14px">
        <span class="viewer-distance" id="distanceValue">—</span>
        <span class="viewer-unit">KM / 100</span>
      </div>

      <div class="viewer-grid">
        <div class="viewer-card">
          <span class="live-label">Snelheid</span>
          <strong id="speedValue">—</strong>
        </div>
        <div class="viewer-card">
          <span class="live-label">Volgende post</span>
          <strong id="nextValue">—</strong>
        </div>
        <div class="viewer-card">
          <span class="live-label">Batterij</span>
          <strong id="batteryValue">—</strong>
        </div>
        <div class="viewer-card">
          <span class="live-label">Laatste update</span>
          <strong id="ageValue">—</strong>
        </div>
      </div>
    </section>

    <div id="viewerMap"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js?v=4.5.0"></script>
  <script src="live.js?v=4.5.0"></script>
</body>
</html>
